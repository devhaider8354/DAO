name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. v2.3). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc make

      - name: Build
        shell: msys2 {0}
        run: make

      - name: Package extension
        shell: pwsh
        run: Compress-Archive -Path extension\* -DestinationPath build\DAO-extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DAO
          path: |
            build/DAO-Setup.exe
            build/dao.exe
            build/dao-cli.exe
            build/DAO-extension.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: DAO ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            build/DAO-Setup.exe
            build/DAO-extension.zip
